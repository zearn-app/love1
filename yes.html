<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>You Said Yes 💖</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #FFC568;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  cursor: none;
}

.card {
  text-align: center;
  color: #763C8C;
  z-index: 2;
  animation: fadeIn 2s ease;
}

h1 {
  font-size: 3rem;
  margin-bottom: 10px;
  animation: glowText 2s ease-in-out infinite alternate;
}

p {
  font-size: 1.4rem;
  min-height: 40px;
}

/* ❤️ HEART */
.heart {
  font-size: 60px;
  color: #fa4843;
  animation: beat 1s infinite;
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

/* 💖 GLOW TEXT */
@keyframes glowText {
  from { text-shadow: 0 0 10px #fff; }
  to { text-shadow: 0 0 30px #fa4843; }
}

/* 💕 FLOATING HEARTS */
.hearts span {
  position: absolute;
  bottom: -50px;
  color: #fa4843;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
}

/* 🎆 CONFETTI */
.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  top: 0;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}

/* 🎵 MUSIC BUTTON */
.music-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #fa4843;
  color: #fff;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}

/* ✨ SPARKLE */
.sparkle {
  position: fixed;
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  pointer-events: none;
  animation: sparkleFade 1s linear forwards;
}

@keyframes sparkleFade {
  to {
    transform: scale(2);
    opacity: 0;
  }
}

/* 🌙 GLOW PARTICLES */
.glow {
  position: absolute;
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  opacity: 0.6;
  animation: glowMove linear infinite;
}

@keyframes glowMove {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* 💭 FLOATING WORDS */
.quote {
  position: absolute;
  color: #763C8C;
  font-size: 14px;
  opacity: 3.5;
  animation: floatQuote linear infinite;
}

@keyframes floatQuote {
  from { transform: translateY(100vh); }
  to { transform: translateY(-20vh); opacity: 0; }
}

</style>
</head>

<body>

<div class="card">
  <div class="heart">❤️</div>
  <h1>You Said YES 💖</h1>
  <p id="message"></p>
  <p id="extraText"></p>
</div>

<div class="hearts" id="hearts"></div>

<audio id="bgMusic" autoplay loop muted playsinline>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="music-btn" id="musicBtn">Music 🎵</div>

<script>

// 💌 TYPEWRITER
const text = "From this moment, it's you and me forever... 💜✨";
let i = 0;
function typeWriter() {
  if (i < text.length) {
    document.getElementById("message").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeWriter, 45);
  }
}
typeWriter();


// 💖 ROTATING TEXT (SMOOTH FADE)
const loveLines = [
  "You're my today and all my tomorrows 💕",
  "Every heartbeat says your name ❤️",
  "I found my forever in you 💍",
  "You are my dream come true ✨",
  "Together is my favorite place 💑"
];

let lineIndex = 0;
const extra = document.getElementById("extraText");

setInterval(() => {
  extra.style.opacity = 0;
  setTimeout(() => {
    extra.innerText = loveLines[lineIndex];
    extra.style.opacity = 1;
    lineIndex = (lineIndex + 1) % loveLines.length;
  }, 400);
}, 3000);


// 💕 HEARTS
setInterval(() => {
  const heart = document.createElement("span");
  heart.innerHTML = "❤";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (10 + Math.random() * 20) + "px";
  heart.style.animationDuration = (4 + Math.random() * 3) + "s";
  document.getElementById("hearts").appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}, 350);


// 🎆 CONFETTI
function createConfetti(x = null) {
  for (let i = 0; i < 25; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = (x ?? Math.random()*100) + "vw";
    c.style.background = ["#763C8C","#fa4843","#fff"][Math.floor(Math.random()*3)];
    c.style.animationDuration = (2 + Math.random()*2) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}
createConfetti();


// 🌙 GLOW PARTICLES
setInterval(() => {
  const g = document.createElement("div");
  g.className = "glow";
  g.style.left = Math.random()*100 + "vw";
  g.style.animationDuration = (6 + Math.random()*6) + "s";
  document.body.appendChild(g);
  setTimeout(() => g.remove(), 12000);
}, 600);


// 💭 FLOATING WORDS
const words = ["Love 💖","Forever 💍","Soulmate 💑","Mine ❤️","Always 💞"];
setInterval(() => {
  const q = document.createElement("div");
  q.className = "quote";
  q.innerText = words[Math.floor(Math.random()*words.length)];
  q.style.left = Math.random()*100 + "vw";
  q.style.animationDuration = (8 + Math.random()*6) + "s";
  document.body.appendChild(q);
  setTimeout(() => q.remove(), 14000);
}, 2200);


// ✨ CURSOR TRAIL (OPTIMIZED)
let lastSparkle = 0;
document.addEventListener("mousemove", e => {
  if (Date.now() - lastSparkle < 40) return;
  lastSparkle = Date.now();

  const s = document.createElement("div");
  s.className = "sparkle";
  s.style.left = e.clientX + "px";
  s.style.top = e.clientY + "px";
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1000);
});


// 🎇 CLICK BURST
document.addEventListener("click", e => {
  createConfetti(e.clientX / window.innerWidth * 100);

  for (let i = 0; i < 8; i++) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = e.clientX + "px";
    s.style.top = e.clientY + "px";
    s.style.background = "#fa4843";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 800);
  }
});


// 🎵 MUSIC
const music = document.getElementById("bgMusic");
const btn = document.getElementById("musicBtn");
let playing = false;

document.body.addEventListener("click", () => {
  music.muted = false;
  music.volume = 0.4;
  music.play();
  playing = true;
}, { once: true });

btn.onclick = () => {
  if (playing) {
    music.pause();
    btn.innerText = "Muted 🔇";
  } else {
    music.play();
    btn.innerText = "Music 🎵";
  }
  playing = !playing;
};

</script>

</body>
</html>
