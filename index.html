<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* ENTRY SCREEN */
.entry {
  position: absolute;
  inset: 0;
  background: #ff6b81;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 2rem;
  cursor: pointer;
  z-index: 10;
}

/* MAIN */
.container {
  text-align: center;
  display: none;
}

h1 {
  color: white;
  font-size: 2.5rem;
  margin-bottom: 10px;
}

p {
  color: white;
  font-size: 1.3rem;
}

/* BUTTON */
button {
  margin-top: 20px;
  padding: 12px 24px;
  border: none;
  border-radius: 25px;
  background: #ff4757;
  color: white;
  font-size: 1rem;
  cursor: pointer;
}

button:hover {
  background: #ff2e43;
}

/* YES MESSAGE */
#yesMessage {
  display: none;
  font-size: 2rem;
  color: white;
  margin-top: 20px;
}

/* SVG */
.container-svg {
  width: 300px;
  margin: auto;
}

/* SOUND */
.sound {
  position: fixed;
  bottom: 10px;
  right: 10px;
  color: white;
  cursor: pointer;
}
.sound--off {
  text-decoration: line-through;
}
</style>
</head>

<body>

<div class="entry" onclick="startExperience()">
  Tap to Open ❤️
</div>

<div class="container" id="main">
  <h1>I Have Something to Say 💖</h1>

  <!-- SVG Animation -->
  <div class="container-svg">
    <svg viewBox="0 0 500 200">
      <g fill="#fff">
        <text x="50%" y="50%" text-anchor="middle" font-size="40">I LOVE YOU</text>
      </g>
    </svg>
  </div>

  <p>You are my today and all of my tomorrows 💕</p>

  <button onclick="sayYes()">Will You Marry Me? 💍</button>

  <div id="yesMessage">❤️ She Said YES! ❤️</div>
</div>

<audio id="music" loop>
  <source src="https://www.fesliyanstudios.com/play-mp3/387" type="audio/mp3">
</audio>

<div class="sound" onclick="toggleSound()">Sound</div>

<script src="https://cdn.jsdelivr.net/mojs/latest/mo.min.js"></script>

<script>
const entry = document.querySelector('.entry');
const main = document.getElementById('main');
const music = document.getElementById('music');

function startExperience() {
  entry.style.display = 'none';
  main.style.display = 'block';
  music.play();
  startAnimation();
}

function sayYes() {
  document.getElementById('yesMessage').style.display = 'block';
}

/* SOUND TOGGLE */
let soundOn = true;
function toggleSound() {
  if (soundOn) {
    music.pause();
    document.querySelector('.sound').classList.add('sound--off');
  } else {
    music.play();
    document.querySelector('.sound').classList.remove('sound--off');
  }
  soundOn = !soundOn;
}

/* MOJS HEART BURST */
function startAnimation() {
  const burst = new mojs.Burst({
    radius: { 0: 100 },
    count: 10,
    children: {
      shape: 'circle',
      fill: ['#ff6b81', '#ff4757', '#ff9ff3'],
      duration: 2000
    }
  });

  setInterval(() => burst.replay(), 2000);
}
</script>

</body>
</html>
